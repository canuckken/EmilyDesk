  <text x="58" y="91" font-size="13" font-weight="bold" class="label">AMOUNT</text>
  <rect x="48" y="98" width="454" height="63" rx="12" fill="url(#panel)" stroke="#ef7718" stroke-width="1.7" filter="url(#glow)"/>
  <text x="68" y="144" font-size="31" font-weight="bold" class="serif">1.00</text><rect x="419" y="109" width="65" height="41" rx="9" fill="url(#badge)" stroke="#ef7718"/><text x="451.5" y="136" text-anchor="middle" font-size="15" font-weight="bold">CAD</text>
  <line x1="58" y1="178" x2="192" y2="178" stroke="#ad521b"/><line x1="358" y1="178" x2="492" y2="178" stroke="#ad521b"/><text x="275" y="176" text-anchor="middle" font-size="13" font-weight="bold" class="label">CONVERTS TO</text>
  <rect x="48" y="187" width="454" height="67" rx="12" fill="url(#panel)" stroke="#ef7718" stroke-width="1.7" filter="url(#glow)"/>
  <text x="68" y="237" font-size="34" font-weight="bold" class="serif amber">0.7147</text><rect x="419" y="200" width="65" height="41" rx="9" fill="url(#badge)" stroke="#ef7718"/><text x="451.5" y="227" text-anchor="middle" font-size="15" font-weight="bold">USD</text>
  <text x="275" y="276" text-anchor="middle" font-size="12" font-weight="bold">1 CAD = 0.714732 USD</text><text x="275" y="296" text-anchor="middle" font-size="10" class="muted">Rates By Exchange Rate API</text><text x="275" y="317" text-anchor="middle" font-size="9" font-weight="bold" class="label">DOUBLE-CLICK TO CHANGE</text>
