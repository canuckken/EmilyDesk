<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="550" height="363" viewBox="0 0 550 363">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26160f"/><stop offset="1" stop-color="#0d0807"/></linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9d4b19"/><stop offset="1" stop-color="#421a0b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>text{font-family:'Segoe UI',sans-serif;fill:#f6dfbd}.serif{font-family:Georgia,serif}.amber{fill:#ff9b28}.label{fill:#dc8131}.muted{fill:#b58b6c}</style>
  </defs>
  <image xlink:href="ember-glow-currency-converter-skin.png" width="550" height="363"/>
